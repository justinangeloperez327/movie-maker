name: Windows desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install matching CXX generator
        run: cargo install cxxbridge-cmd --version 1.0.205 --locked

      - name: Install FFmpeg tools for media indexing tests
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Configure Qt/C++ and Rust build
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build Windows desktop application
        run: cmake --build build --config Release --parallel 2

      - name: Rust-CXX-Qt integration smoke test
        shell: pwsh
        run: |
          & ".\build\Release\movie_maker.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Project management roundtrip smoke test
        shell: pwsh
        run: |
          & ".\build\Release\movie_maker.exe" --project-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Media indexing and persistence smoke test
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "movie-maker-media-fixtures"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $video = Join-Path $folder "sample.avi"
          $audio = Join-Path $folder "sample.wav"
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=160x90:rate=10" -t 1 -c:v mpeg4 $video
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 1 -c:a pcm_s16le $audio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\\build\\Release\\movie_maker.exe" --media-self-test $video $audio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Qt Quick workspace smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          & ".\\build\\Release\\movie_maker.exe" --ui-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

